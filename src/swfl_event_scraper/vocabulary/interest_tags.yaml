# Controlled interest vocabulary for the household event ledger.
#
# Every tag is dotted `family.leaf`. `audience` is the DEFAULT attribution the
# matcher writes when nothing in the event text overrides it: `me` (Luis),
# `her` (Johannah), `both`.
#
# `evidence` is the canon path the tag was read off. Nothing here was invented:
# the vocabulary was derived on 2026-09-09 from Johannah's halo and its sibling
# signal notes under 06_halos/people/. Where a tag is thin, `confidence: low`
# says so rather than pretending.
#
# `weight` is the matcher's base contribution to `rating` (0-5) when the tag
# fires. `match` is the case-insensitive regex the matcher runs against
# title + description + category + venue.
#
# Costs (down-rating) live in a separate `costs:` block at the bottom. The
# largest one is NOT an interest miss: Johannah's sobriety date is 2025-08-17,
# so alcohol-centred events are hard down-rated. That was found in the halo
# and was absent from the lane's original brief.

